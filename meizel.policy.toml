# The policy of this repository: what its own checker run (`python -m meizel check`) admits, and, as
# the installation its tests run from, the Node package that supplies the TypeScript compiler.

[typescript]
package-dir = ["toolchain"]


# injected-calls (meizel/language/python/scanner): a call whose receiver is a parameter holding a callable, not a
# path. The purity rule matches a path method by its attribute name, so `deps.read_text(...)` is
# reported as `Path.read_text`; narrowing the match to receivers provably of type Path would miss
# `p = some_path(); p.read_text()`, and missing a read costs more than reporting one. The false
# positive gets an exit instead: a site is `path.py#function#receiver.method`, the receiver must be a
# parameter of that function (a receiver built there -- `Path("x")`, a local, `self.path` -- is a path
# and is refused), and the entry states why. `max-sites` is the list's budget: every site hides one
# `impure-call`, so a run past the ceiling fails as `approved-budget`, and a site the file no longer
# makes fails as `stale-approval`. A declared site is counted apart from the reads it does not excuse
# (`meizel check` says "N sites declared an injected callable, not a read"), so the two never merge.
[injected-calls]
"max-sites" = ["8"]

# meizel/ — the reads behind `meizel.graph.universe.SourceTree`. The port's fields are named after the
# `pathlib` methods they hold (`is_file`, `is_dir`, `resolve`, `rglob`, `read_bytes`), so the purity
# rule matches them by attribute name: the receiver is a parameter holding a callable the entry
# handed in, not a path, and the read already happened where the tree was bound. Declaring the site
# is what lets `meizel.lint_common` and `meizel.frontend_deps` stay decisions; the ledger's
# `impure-call` rows for those reads are gone, and `meizel check` counts these apart from a read.
[injected-calls.sites]
"meizel/lint_common.py#_is_file#tree.is_file" = "the tree is the caller's: `meizel.checkout.source_tree` binds the predicate where the checkout is owned, and this module only asks which targets a lint judges"
"meizel/lint_common.py#_is_dir#tree.is_dir" = "the same tree answers whether a target is a directory; the walk below it is `tree.rglob`, also the caller's"
"meizel/lint_common.py#_resolved_target#tree.resolve" = "`--only` and explicit targets arrive as typed text, and resolving one into a real path is the read the entry's tree answers"
"meizel/lint_common.py#_files_in_target#tree.rglob" = "a directory target outside the admitted set has no listing to reuse, so the walk is asked here and the caller's tree performs it"
"meizel/lint_common.py#read_utf8_text#tree.read_bytes" = "the reader around `decode_source`: the bytes come from the tree the lint was handed, so this module owns the decoding and not the read"
"meizel/frontend_deps.py#observe#tree.is_dir" = "the frontend install is observed through the tree the analyzer was handed, so the probe is a value here rather than a `pathlib` call"
"meizel/frontend_deps.py#observe#tree.is_file" = "the pnpm metadata probe is the same tree: `meizel.checkout.source_tree` bound the predicate and this module decides what the answer means"
"meizel/frontend_deps.py#_digest#tree.read_bytes" = "the locked compiler's digest is read through the tree, so hash and comparison stay here and the bytes stay the shell's"
