exports = ["__init__.py", "closure_at.py"]

[uses]
"__init__.py" = ["cache.py", "fixtures.py", "frontend.py", "judge", "purity.py", "record.py", "resolve", "scanner.py"]
"ambient.py" = ["fake_entropy.py", "patching.py", "resolve"]
"cache.py" = ["record.py", "resolve", "scanner.py"]
"closure_at.py" = ["resolve"]
"fixture_scan.py" = ["fixtures.py"]
"fixtures.py" = ["resolve"]
"frontend.py" = ["cache.py", "judge", "resolve", "restricted.py", "scanner.py"]
"input_mutations.py" = ["record.py", "resolve"]
"judge" = ["cache.py", "fixtures.py", "purity.py", "record.py", "resolve", "scanner.py"]
"patching.py" = ["purity.py", "python_commands.py", "resolve", "restricted.py"]
"purity.py" = ["purity_structure.py", "resolve"]
"python_commands.py" = ["restricted.py"]
"record.py" = ["fixtures.py"]
"restricted.py" = ["resolve"]
"scanner.py" = ["ambient.py", "fixture_scan.py", "fixtures.py", "input_mutations.py", "purity.py", "record.py", "resolve", "restricted.py"]

[purity]
"." = "strict"
"closure_at.py" = { mode = "none", why = "the entry that turns a checkout's root path into a universe (`meizel.checkout.load_universe` runs git for it) and hands it to the closure; what the closure contains is decided in resolve/impacted.py" }
"cache.py" = "strict"
"fixtures.py" = "strict"
"frontend.py" = "strict"
"purity.py" = "strict"
"scanner.py" = "strict"
